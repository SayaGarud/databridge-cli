[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "databridge"
version = "0.1.0"
description = "A CLI tool connecting PubMed literature with GEO/SRA biological datasets."
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "biopython>=1.81",
    "rich>=13.0.0",
    "requests>=2.31.0"
]

[project.scripts]
databridge = "databridge.cli:main"